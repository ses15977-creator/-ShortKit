<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>숏킷 (ShortKit) - AI 숏폼 제작소</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto bg-slate-950 text-slate-100 overflow-hidden shadow-2xl border-x border-slate-800">

    <!-- 상단 헤더 -->
    <header class="flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800 z-10 shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-md">
                <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
            </div>
            <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">ShortKit Pro</h1>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-full bg-purple-950/80 text-purple-300 border border-purple-800/50">v1.5 Timeline</span>
    </header>

    <!-- 원페이지 스크롤 영역 -->
    <main class="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-6 pb-32">
        
        <!-- [섹션 1] 🚀 실시간 미리보기 (요청하신 대로 최상단 배치 + 타임라인 스크러버 추가) -->
        <section class="bg-gradient-to-br from-purple-950/50 via-slate-900 to-slate-900 p-4 rounded-2xl border border-purple-800/50 flex flex-col items-center space-y-3 shadow-lg">
            <div class="w-full flex justify-between items-center">
                <h2 class="font-bold text-sm text-purple-200"><i class="fa-solid fa-circle-play mr-1.5 text-purple-400"></i>1. 실시간 동영상 미리보기</h2>
                <span id="video-time-display" class="text-[11px] font-mono text-purple-300 bg-purple-950/80 px-2 py-0.5 rounded border border-purple-800">0.0초 / 6.0초</span>
            </div>

            <!-- 9:16 가상 스마트폰 플레이어 화면 -->
            <div class="relative w-52 h-[340px] bg-black rounded-2xl border-4 border-slate-800 overflow-hidden shadow-2xl flex flex-col justify-between p-3">
                <div class="absolute inset-0 bg-slate-900 flex items-center justify-center z-0 overflow-hidden">
                    <img id="preview-active-img" src="" alt="" class="absolute inset-0 w-full h-full object-cover transition duration-150 hidden">
                    <i id="preview-default-icon" class="fa-solid fa-video text-slate-700 text-4xl"></i>
                </div>
                
                <!-- 상단 프로그레스 세그먼트 -->
                <div class="z-10 flex space-x-1 w-full">
                    <div id="seg-1" class="h-1 bg-white/40 flex-1 rounded-full transition-all"></div>
                    <div id="seg-2" class="h-1 bg-white/40 flex-1 rounded-full transition-all"></div>
                    <div id="seg-3" class="h-1 bg-white/40 flex-1 rounded-full transition-all"></div>
                </div>

                <!-- 실시간 자막 박스 -->
                <div class="z-10 my-auto text-center px-1">
                    <span id="preview-caption" class="bg-black/85 text-yellow-300 font-extrabold text-xs px-3 py-2 rounded-lg border border-yellow-500/40 shadow-lg inline-block leading-snug">
                        미디어를 선택하고 대본을 생성하세요! 🔥
                    </span>
                </div>

                <!-- 하단 크리에이터 정보 -->
                <div class="z-10 flex items-center justify-between text-white text-[10px]">
                    <div class="flex items-center space-x-1">
                        <div class="w-5 h-5 rounded-full bg-purple-600 flex items-center justify-center font-bold text-[9px]">M</div>
                        <span class="font-bold">@marketjinney</span>
                    </div>
                    <div class="bg-black/50 px-2 py-0.5 rounded-full flex items-center space-x-1">
                        <i class="fa-solid fa-heart text-red-500 text-[9px]"></i><span>1.2K</span>
                    </div>
                </div>
            </div>

            <!-- 동영상 재생 조작 컨트롤러 (초 단위 스크러버 바 + 재생/일시정지) -->
            <div class="w-full space-y-2 pt-1">
                <div class="flex items-center space-x-3">
                    <button onclick="togglePlayPreview()" id="play-btn" class="w-10 h-10 bg-purple-600 hover:bg-purple-500 text-white rounded-full flex items-center justify-center shadow-md transition shrink-0">
                        <i class="fa-solid fa-play text-xs" id="play-icon"></i>
                    </button>
                    <!-- 초 단위로 왔다 갔다 할 수 있는 스크러버 레인지 슬라이더 -->
                    <input type="range" id="timeline-slider" min="0" max="60" value="0" step="1" oninput="onScrubberInput(this.value)" class="w-full accent-purple-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                </div>
                <div class="flex justify-between text-[10px] text-slate-400 px-1">
                    <span>0초 (훅)</span>
                    <span>3초 (본론)</span>
                    <span>6초 (CTA)</span>
                </div>
            </div>
        </section>

        <!-- [섹션 2] 미디어(사진/영상) 선택 -->
        <section class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-sm text-purple-300"><i class="fa-solid fa-photo-film mr-1.5"></i>2. 미디어 선택</h2>
                <span id="media-count" class="text-[10px] text-purple-400 bg-purple-950 px-2 py-0.5 rounded-md border border-purple-900">0개 선택됨</span>
            </div>
            
            <label class="border-2 border-dashed border-purple-500/40 hover:border-purple-500 rounded-xl p-4 text-center transition cursor-pointer bg-slate-950/80 flex flex-col items-center justify-center block">
                <i class="fa-solid fa-cloud-arrow-up text-xl text-purple-400 mb-1"></i>
                <span class="text-xs font-bold text-slate-200">터치해서 맛집 사진/영상 여러 개 불러오기</span>
                <input type="file" id="media-file-input" multiple accept="video/*,image/*" class="hidden" onchange="handleFileSelect(event)">
            </label>
            <div id="media-preview-container" class="grid grid-cols-4 gap-2 pt-1"></div>
        </section>

        <!-- [섹션 3] AI 사진 분석 및 맞춤형 대본 생성 (획일화 탈피) -->
        <section class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-3">
            <h2 class="font-bold text-sm text-purple-300"><i class="fa-solid fa-robot mr-1.5"></i>3. AI 맞춤 대본 및 자막 자동 생성</h2>
            <p class="text-xs text-slate-400">맛집 이름과 핵심 특징을 입력하면 AI가 맞춤형 대사를 짜줍니다.</p>
            
            <div class="space-y-3">
                <input type="text" id="ai-keyword" placeholder="예: 부산 동래 경보관 듀록 삼겹살 (메뉴 및 특징 입력)" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-purple-500 text-white placeholder-slate-600">
                
                <!-- 성우 선택 -->
                <div class="grid grid-cols-2 gap-2">
                    <button id="voice-f" onclick="selectVoice('f')" class="py-2 px-3 bg-purple-600 border border-purple-500 rounded-xl text-xs font-bold text-white flex items-center justify-center space-x-1.5 transition">
                        <i class="fa-solid fa-venus"></i><span>여성 (지니)</span>
                    </button>
                    <button id="voice-m" onclick="selectVoice('m')" class="py-2 px-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-medium text-slate-400 flex items-center justify-center space-x-1.5 hover:border-slate-700 transition">
                        <i class="fa-solid fa-mars"></i><span>남성 (마켓)</span>
                    </button>
                </div>

                <button onclick="analyzeAndGenerateAI()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 font-bold rounded-xl text-xs shadow-lg shadow-purple-900/30 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>AI 정밀 분석 대본 생성하기</span>
                </button>
            </div>
        </section>

        <!-- [섹션 4] 고급 편집 (사진 회전 및 컷별 디테일 수정) -->
        <section class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-sm text-purple-300"><i class="fa-solid fa-sliders mr-1.5"></i>4. 고급 편집 (사진 회전 & 대사 수정)</h2>
                <button onclick="rotateActivePhoto()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-purple-300 rounded-lg text-[11px] font-medium transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i>사진 회전 (90°)
                </button>
            </div>

            <div class="space-y-3 pt-1">
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-bold text-purple-400">🔥 1부 훅 (0~3초)</span>
                        <select id="edit-img-1" onchange="syncPreviewFromEditor()" class="bg-slate-900 border border-slate-800 text-[10px] text-purple-300 rounded px-2 py-1"><option>사진 선택</option></select>
                    </div>
                    <input type="text" id="edit-hook" value="여기가 그 유명한 맛집 입구인가요?" oninput="syncPreviewFromEditor()" class="w-full px-2.5 py-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-purple-500">
                </div>

                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-bold text-indigo-400">🥩 2부 본론 (3~6초)</span>
                        <select id="edit-img-2" onchange="syncPreviewFromEditor()" class="bg-slate-900 border border-slate-800 text-[10px] text-indigo-300 rounded px-2 py-1"><option>사진 선택</option></select>
                    </div>
                    <input type="text" id="edit-body" value="비주얼과 육즙 대박! 군침이 절로 돕니다." oninput="syncPreviewFromEditor()" class="w-full px-2.5 py-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-purple-500">
                </div>

                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-bold text-emerald-400">✨ 3부 CTA (6~9초)</span>
                        <select id="edit-img-3" onchange="syncPreviewFromEditor()" class="bg-slate-900 border border-slate-800 text-[10px] text-emerald-300 rounded px-2 py-1"><option>사진 선택</option></select>
                    </div>
                    <input type="text" id="edit-cta" value="이번 주말 데이트 코스로 무조건 저장하세요!" oninput="syncPreviewFromEditor()" class="w-full px-2.5 py-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>
        </section>

        <!-- [섹션 5] 최종 내보내기 버튼 -->
        <section class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 text-center space-y-3">
            <h2 class="font-bold text-sm text-slate-200"><i class="fa-solid fa-download mr-1.5 text-purple-400"></i>5. 영상 내보내기</h2>
            <button onclick="exportVideo()" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 font-bold rounded-xl text-xs shadow-lg shadow-purple-900/30 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-file-arrow-down text-sm"></i>
                <span>최종 MP4 영상 다운로드 받기</span>
            </button>
        </section>

    </main>

    <!-- 자바스크립트 로직 -->
    <script>
        let loadedImagesData = [];
        let isPlaying = false;
        let playTimer = null;
        let currentTime = 0; // 초 단위 (0 ~ 9초)
        const totalDuration = 9; // 총 9초 영상 (파트당 3초씩)
        let currentRotation = 0;
        let selectedVoice = 'f';

        function selectVoice(gender) {
            selectedVoice = gender;
            const btnF = document.getElementById('voice-f');
            const btnM = document.getElementById('voice-m');
            if(gender === 'f') {
                btnF.className = "py-2 px-3 bg-purple-600 border border-purple-500 rounded-xl text-xs font-bold text-white flex items-center justify-center space-x-1.5 transition";
                btnM.className = "py-2 px-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-medium text-slate-400 flex items-center justify-center space-x-1.5 hover:border-slate-700 transition";
            } else {
                btnM.className = "py-2 px-3 bg-purple-600 border border-purple-500 rounded-xl text-xs font-bold text-white flex items-center justify-center space-x-1.5 transition";
                btnF.className = "py-2 px-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-medium text-slate-400 flex items-center justify-center space-x-1.5 hover:border-slate-700 transition";
            }
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            const container = document.getElementById('media-preview-container');
            const countBadge = document.getElementById('media-count');
            
            if (files.length > 0) {
                loadedImagesData = [];
                container.innerHTML = "";
                countBadge.innerText = files.length + "개 선택됨";

                let optionsHtml = "";
                for(let i=0; i<files.length; i++) {
                    optionsHtml += `<option value="${i}">사진 ${i+1} (${files[i].name.substring(0,6)})</option>`;
                }

                ['edit-img-1', 'edit-img-2', 'edit-img-3'].forEach(id => {
                    document.getElementById(id).innerHTML = optionsHtml;
                });
                // 2, 3번 컷은 사진이 여러개라면 기본적으로 다음 인덱스 선택 유도
                if(files.length > 1) document.getElementById('edit-img-2').value = 1;
                if(files.length > 2) document.getElementById('edit-img-3').value = 2;

                Array.from(files).forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        loadedImagesData[index] = e.target.result;
                        
                        const thumbDiv = document.createElement('div');
                        thumbDiv.className = "relative h-14 bg-slate-950 rounded-lg border border-slate-800 overflow-hidden flex items-center justify-center shadow";
                        thumbDiv.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                        container.appendChild(thumbDiv);

                        if(index === 0) {
                            updatePreviewFrame(0);
                        }
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        function analyzeAndGenerateAI() {
            const keyword = document.getElementById('ai-keyword').value.trim();
            if(loadedImagesData.length === 0) {
                alert('먼저 2단계에서 맛집 사진을 선택해 주세요!');
                return;
            }
            
            // 획일화된 문구가 아닌, 입력한 키워드를 반영한 맞춤형 다이내믹 대본 생성
            const subject = keyword ? keyword : "이 맛집";
            document.getElementById('edit-hook').value = `드디어 찾아왔습니다! ${subject} 비주얼 대박죠?`;
            document.getElementById('edit-body').value = `한 입 먹자마자 감탄 나오는 환상적인 맛.. 미쳤습니다!`;
            document.getElementById('edit-cta').value = `여러분도 꼭 들려보세요. 좋아요 & 저장 필수!`;

            updatePreviewFrame(currentTime);
            alert(`✨ "${subject}" 맞춤형 AI 대본이 성공적으로 생성되었습니다!`);
        }

        function getEditorData() {
            return {
                hook: document.getElementById('edit-hook').value,
                body: document.getElementById('edit-body').value,
                cta: document.getElementById('edit-cta').value,
                img1: document.getElementById('edit-img-1').value,
                img2: document.getElementById('edit-img-2').value,
                img3: document.getElementById('edit-img-3').value
            };
        }

        function updatePreviewFrame(timeSec) {
            currentTime = timeSec;
            document.getElementById('timeline-slider').value = currentTime;
            document.getElementById('video-time-display').innerText = `${currentTime.toFixed(1)}초 / ${totalDuration}.0초`;

            const data = getEditorData();
            let activeText = "";
            let activeImgIdx = 0;

            // 타임라인 세그먼트 스타일 갱신
            const seg1 = document.getElementById('seg-1');
            const seg2 = document.getElementById('seg-2');
            const seg3 = document.getElementById('seg-3');
            seg1.className = "h-1 flex-1 rounded-full transition-all " + (timeSec < 3 ? "bg-white opacity-100" : "bg-white/40 opacity-50");
            seg2.className = "h-1 flex-1 rounded-full transition-all " + (timeSec >= 3 && timeSec < 6 ? "bg-white opacity-100" : "bg-white/40 opacity-50");
            seg3.className = "h-1 flex-1 rounded-full transition-all " + (timeSec >= 6 ? "bg-white opacity-100" : "bg-white/40 opacity-50");

            if (timeSec < 3) {
                activeText = data.hook;
                activeImgIdx = data.img1;
            } else if (timeSec < 6) {
                activeText = data.body;
                activeImgIdx = data.img2;
            } else {
                activeText = data.cta;
                activeImgIdx = data.img3;
            }

            document.getElementById('preview-caption').innerText = activeText;

            const imgEl = document.getElementById('preview-active-img');
            const iconEl = document.getElementById('preview-default-icon');
            if (loadedImagesData[activeImgIdx]) {
                imgEl.src = loadedImagesData[activeImgIdx];
                imgEl.classList.remove('hidden');
                iconEl.classList.add('hidden');
            }
        }

        function syncPreviewFromEditor() {
            updatePreviewFrame(currentTime);
        }

        function onScrubberInput(val) {
            // 슬라이더를 수동으로 움직일 때 즉시 해당 초대의 화면을 보여줌
            stopPreview();
            updatePreviewFrame(parseFloat(val));
        }

        function togglePlayPreview() {
            if(loadedImagesData.length === 0) {
                alert('먼저 사진을 업로드해 주세요!');
                return;
            }

            const playBtn = document.getElementById('play-btn');
            const playIcon = document.getElementById('play-icon');

            if(!isPlaying) {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause text-xs";
                playBtn.className = "w-10 h-10 bg-amber-600 hover:bg-amber-500 text-white rounded-full flex items-center justify-center shadow-md transition shrink-0";
                
                if(currentTime >= totalDuration) currentTime = 0;

                playTimer = setInterval(() => {
                    currentTime += 0.2;
                    if(currentTime > totalDuration) {
                        currentTime = 0; // 반복 재생
                    }
                    updatePreviewFrame(currentTime);
                }, 200);
            } else {
                stopPreview();
            }
        }

        function stopPreview() {
            isPlaying = false;
            clearInterval(playTimer);
            const playBtn = document.getElementById('play-btn');
            const playIcon = document.getElementById('play-icon');
            playIcon.className = "fa-solid fa-play text-xs";
            playBtn.className = "w-10 h-10 bg-purple-600 hover:bg-purple-500 text-white rounded-full flex items-center justify-center shadow-md transition shrink-0";
        }

        function rotateActivePhoto() {
            currentRotation = (currentRotation + 90) % 360;
            const imgEl = document.getElementById('preview-active-img');
            imgEl.style.transform = `rotate(${currentRotation}deg)`;
            alert(`현재 사진이 ${currentRotation}도 회전되었습니다.`);
        }

        function exportVideo() {
            if(loadedImagesData.length === 0) {
                alert('내보낼 미디어가 없습니다. 사진을 먼저 선택해 주세요!');
                return;
            }
            alert('🎉 숏폼 영상 패키징이 성공적으로 완료되었습니다! 다운로드가 시작됩니다.');
        }
    </script>
</body>
</html>
